{{#if pagination}}<nav class="pagination" aria-label="Pagination">
  {{#if pagination.prev}}<a href="{{pagination.prev}}" rel="prev">← Newer</a>{{/if}}
  <span>Page {{pagination.current}} of {{pagination.total}}</span>
  {{#if pagination.next}}<a href="{{pagination.next}}" rel="next">Older →</a>{{/if}}
</nav>{{/if}}
