<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <p class="footer-brand">{{site.title}}</p>
      <p class="footer-desc">{{site.description}}</p>
    </div>
    <div>
      <p class="footer-head">Pages</p>
      <ul>{{#each pages}}<li><a href="{{path}}">{{title}}</a></li>{{/each}}</ul>
    </div>
    <div>
      <p class="footer-head">Subscribe</p>
      <ul>
        <li><a href="/feed.xml">RSS feed</a></li>
        <li><a href="/sitemap.xml">Sitemap</a></li>
        <li><a href="/llms.txt">llms.txt</a></li>
      </ul>
    </div>
  </div>
  <div class="wrap footer-bottom">
    <span>© {{year}} {{site.title}}</span>
    <span>Proudly powered by <a href="/about/">PressyCMS</a> — no database required.</span>
  </div>
</footer>
