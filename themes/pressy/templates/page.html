<main id="main" class="wrap narrow">
  <article class="entry">
    <header class="entry-header">
      <h1 class="entry-title">{{doc.title}}</h1>
      {{#if doc.description}}<p class="lead">{{doc.description}}</p>{{/if}}
    </header>
    <div class="entry-content">
      {{{doc.html}}}
    </div>
  </article>
</main>
