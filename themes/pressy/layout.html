<!DOCTYPE html>
<html lang="{{site.language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{meta.title}}</title>
  <meta name="description" content="{{meta.description}}">
  <meta name="robots" content="{{#if meta.noindex}}noindex, nofollow{{else}}index, follow, max-image-preview:large{{/if}}">
  <link rel="canonical" href="{{meta.canonical}}">
  <meta name="generator" content="{{site.generator}}">
  <meta property="og:site_name" content="{{site.title}}">
  <meta property="og:type" content="{{meta.ogType}}">
  <meta property="og:title" content="{{meta.title}}">
  <meta property="og:description" content="{{meta.description}}">
  <meta property="og:url" content="{{meta.canonical}}">
  {{#if meta.image}}<meta property="og:image" content="{{meta.image}}">
  <meta name="twitter:image" content="{{meta.image}}">{{/if}}
  <meta name="twitter:card" content="{{#if meta.image}}summary_large_image{{else}}summary{{/if}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="{{site.title}}" href="{{meta.feed}}">
  {{#each assets.styles}}<link rel="stylesheet" href="{{this}}">
  {{/each}}{{{meta.jsonld}}}
</head>
<body class="theme-pressy">
  <a class="skip-link" href="#main">Skip to content</a>
  {{> header}}
  {{{body}}}
  {{> footer}}
  {{#each assets.scripts}}<script src="{{this}}" defer></script>
  {{/each}}
</body>
</html>
