name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Content lint (SEO, accessibility, blocks)
        run: npx pressy lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
